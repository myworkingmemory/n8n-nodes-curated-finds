# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# First release: a package must exist before npm trusted publishing can be set
# up. Use a separately authorized, short-lived granular bootstrap token stored
# only in this repository's NPM_TOKEN Actions secret; revoke it after verifying
# publication and remove the secret. For a new unscoped package, npm may require
# access to all current/future packages rather than the not-yet-created package.
#
# Later releases: configure npm trusted publishing for owner myworkingmemory,
# repository n8n-nodes-curated-finds, workflow publish.yml shortly before the
# next legitimate release. Explicitly grant direct publication if intended;
# current npm defaults may allow staging only. Leave NPM_TOKEN unset for OIDC.
#
# Initial prepared version: commit/push the reviewed source, verify its CI, then
# push tag 0.1.0 only after npm access is ready. In GitHub Actions the official
# CLI publishes the existing package version with provenance, without bumping
# it. Verify every release tag matches package.json; npm versions are immutable.
# Local npm run release instead starts an interactive version-bump flow.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Validate without product API requests
        run: npm run check && npm run scan:local

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write above).
        # Lint and build run automatically as part of the release process.
        #
        # Option A (OIDC): leave NPM_TOKEN unset — the token step is skipped and
        #   npm uses the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets — it is written to
        #   .npmrc here before publishing.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
