name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Lint, build and run mocked integration tests
        run: npm run check

      - name: Scan local source and packed artifact
        run: npm run scan:local
